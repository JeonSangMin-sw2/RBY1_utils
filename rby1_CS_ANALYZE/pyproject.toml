[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rby1-cs-analyzer-v5"
version = "5.0.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<0.128",
  "numpy>=1.24",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "rby1-sdk>=0.9.1",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23", "ruff==0.8.6"]
package = ["pyinstaller>=6.7"]

[project.scripts]
rby1-cs-analyzer-v5 = "rby1_analyzer.launcher:main"
rby1-cs-analyzer-v5-cli = "rby1_analyzer.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/rby1_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py310"
line-length = 100
