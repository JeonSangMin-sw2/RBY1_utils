  # 관절 상태 갱신 시간 초과 (배선 단선, BNO 리셋, CAN 통신 결함 등 종합 진단)
  - id: joint_state_update_timeout
    major_category: communication
    sub_category: state_update_timeout
    family: joint_state_timeout
    title: "관절 상태 갱신 시간 초과 (CAN 통신/배선 이상)"
    pattern: "timeout:\\s*joint\\s*['\"]?([^'\" ]+).*state update exceeded timeout"
    meaning: "해당 관절의 상태 업데이트 데이터가 설정된 주기(200ms) 내에 수신되지 않았습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "통신 타임아웃은 명확하나 배선 단선·BNO 초기화·퓨즈 단선 중 어느 원인인지는 하드웨어 계측 확인이 필요합니다."
    causes:
      - "WY1(left_arm_4/right_arm_4) 등 중간 관절 조립체 내부 배선의 피복 손상, 찝힘 또는 단선/쇼트 가능성"
      - "모터 제어기 EEPROM 휘발로 BNO(Board Numbering)가 15번으로 초기화되었을 가능성"
      - "PDU 내부 해당 파트 48V 전원 퓨즈 단선 또는 CAN 커넥터 접촉 불량"
      - "RPC 호스트의 일시적 실시간 루프 스케줄링 지연"
    checks:
      - "동일 암의 복수 관절(예: left_arm_3, left_arm_6)이 함께 타임아웃되는지 확인하십시오."
      - "WY1(left_arm_4) 관절부 조립체 내부 배선의 선 찝힘 또는 쇼트 흔적을 점검하십시오."
      - "모터 보드 번호 확인 시 BNO가 15번으로 변경되어 있는지 확인하십시오."
      - "멀티미터로 CAN 라인(종단저항 120Ω) 및 신호선 저항/도통 상태를 측정하십시오."
      - "PDU 해당 파트 퓨즈가 단선되었는지 점검하십시오."
    remedies:
      - "배선 쇼트/단선 확인 시: 모터 제어 보드 교체 및 BNO 설정 진행 후 WY1 조립체를 교체하십시오."
      - "BNO 15번 확인 시: BNO 재설정 및 모터 제어 보드를 교체하십시오."
      - "퓨즈 단선 시: 쇼트 원인 제거 후 규격 퓨즈로 교체하십시오."
      - "단순 유격 시: 커넥터 재결착 및 케이블 걸림 방지 정리를 수행하십시오."
    evidence_gaps:
      - "로그의 Timeout 문구만으로는 물리적 단선, BNO 리셋, 퓨즈 단선을 확정할 수 없으므로 하드웨어 계측(BNO/저항/전압)이 필요합니다."
    group_window: 1.0
    specificity: 100

