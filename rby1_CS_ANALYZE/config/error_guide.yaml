version: 1.0

# -----------------------------------------------------------------------------
# RB-Y1 CS 분석기 에러 가이드 및 진단 룰 정의 (대분류 / 소분류 체계)
# -----------------------------------------------------------------------------

categories:
  - id: motor_joint
    label: "모터 / 조인트"
    description: "모터 드라이버 오류, 서보온 실패, 전류/온도/비트 에러, 엔코더 이상"
    subcategories:
      - id: arm6_wakeup
        label: "Arm 6축 기동"
      - id: motor_communication
        label: "모터 통신 미수신"
      - id: drive_bit_error
        label: "모터 드라이브 비트 에러"
      - id: tracking_error
        label: "관절 추종 오차"
      - id: pid_gain
        label: "PID Gain 조회"

  - id: control_manager
    label: "Control Manager"
    description: "Control Manager FSM 상태 전환, Major/Minor Fault, 제어 루프"
    subcategories:
      - id: fault_reaction
        label: "Fault 대응 절차"
      - id: state_transition
        label: "상태 머신 전환"
      - id: state_rejection
        label: "상태 조건 불일치"
      - id: loop_delay
        label: "실시간 루프 지연"
      - id: control_lifecycle
        label: "제어 라이프사이클"

  - id: hardware_power
    label: "하드웨어 / 전원"
    description: "48V/24V/12V/5V 전원 레일, EMO 스위치, 하드웨어 준비 상태"
    subcategories:
      - id: emo_switch
        label: "EMO 비상정지"
      - id: power_48v_mismatch
        label: "48V 전원 불일치"
      - id: power_state_loss
        label: "Enable 중 전원 변경"
      - id: power_command_timeout
        label: "전원 명령 타임아웃"
      - id: hardware_readiness
        label: "하드웨어 준비 상태"

  - id: communication
    label: "CAN / 네트워크 통신"
    description: "CAN 버스 타임아웃, 관절 상태 갱신 타임아웃"
    subcategories:
      - id: state_update_timeout
        label: "관절 상태 갱신 지연"
      - id: generic_timeout
        label: "일반 통신 타임아웃"

  - id: safety_kinematics
    label: "안전 / 기구학"
    description: "소프트웨어/하드웨어 위치 한계 초과, 특이점(Singularity)"
    subcategories:
      - id: position_limit
        label: "관절 위치 한계"
      - id: target_bound
        label: "목표 위치 범위 초과"
      - id: singularity
        label: "Cartesian 특이점"
      - id: invalid_reference
        label: "유효하지 않은 Reference"

  - id: service_api
    label: "서비스 / RPC"
    description: "gRPC 명령 타임아웃, 제어 취소 실패, 우선순위 부족"
    subcategories:
      - id: invalid_request
        label: "유효하지 않은 제어 요청"
      - id: priority_rejected
        label: "우선순위 부족"
      - id: command_missing
        label: "Command 미설정"
      - id: grpc_error
        label: "gRPC 요청 값 오류"
      - id: cancellation_failure
        label: "제어 취소 프로세스 실패"
      - id: operation_failed
        label: "서비스 연산 실패"
      - id: generic_error
        label: "미분류 오류"

# -----------------------------------------------------------------------------
# 진단 및 장애 매핑 규칙 목록
# -----------------------------------------------------------------------------
rules:
  # Major / Minor Fault
  - id: major_fault_reaction
    major_category: control_manager
    sub_category: fault_reaction
    family: major_fault
    title: "MajorFault 대응 절차 시작"
    pattern: "major fault reaction started"
    meaning: "Control Manager가 MajorFault 대응 절차를 시작했습니다."
    severity: critical
    role: reaction
    confidence: high
    causes:
      - "이 행은 원인보다 앞선 장애에 대한 후속 반응일 가능성이 높습니다."
    checks:
      - "같은 시각 직전의 최초 오류와 상태 변화를 확인하십시오."
    remedies:
      - "선행 원인을 확인한 뒤 Fault 복구 절차를 수행하십시오."
    evidence_gaps:
      - "이 행만으로 MajorFault의 최초 원인은 확정할 수 없습니다."
    group_window: 1.0
    specificity: 95

  - id: minor_fault_reaction
    major_category: control_manager
    sub_category: fault_reaction
    family: minor_fault
    title: "MinorFault 대응 절차 시작"
    pattern: "minor fault reaction started"
    meaning: "Control Manager가 MinorFault 대응 절차를 시작했습니다."
    severity: warning
    role: reaction
    confidence: high
    causes:
      - "이 행은 선행 제어 오류에 대한 후속 반응일 가능성이 높습니다."
    checks:
      - "같은 시각 직전의 제어 오류를 확인하십시오."
    remedies:
      - "선행 원인을 제거한 뒤 Control Manager를 복구하십시오."
    evidence_gaps:
      - "이 행만으로 MinorFault의 최초 원인은 확정할 수 없습니다."
    group_window: 1.0
    specificity: 95

  - id: major_fault_state
    major_category: control_manager
    sub_category: state_transition
    family: major_fault
    title: "Control Manager MajorFault"
    pattern: "control manager state changed to 'majorfault'"
    meaning: "Control Manager 상태가 MajorFault로 전환되었습니다."
    severity: critical
    role: status
    confidence: high
    causes:
      - "직전 하드웨어, 통신, 전원 또는 제어 오류가 MajorFault 전환을 유발했을 가능성이 있습니다."
    checks:
      - "직전 3초의 최초 error 로그와 영향을 받은 축을 확인하십시오."
    remedies:
      - "선행 장애를 해소한 뒤 정해진 Fault 복구 절차를 수행하십시오."
    evidence_gaps:
      - "상태 전환 자체는 최초 원인을 설명하지 않습니다."
    group_window: 1.0
    specificity: 90

  - id: minor_fault_state
    major_category: control_manager
    sub_category: state_transition
    family: minor_fault
    title: "Control Manager MinorFault"
    pattern: "control manager state changed to 'minorfault'"
    meaning: "Control Manager 상태가 MinorFault로 전환되었습니다."
    severity: warning
    role: status
    confidence: high
    causes:
      - "직전 제어 오류, Singularity 또는 유효하지 않은 명령이 MinorFault 전환과 연관되었을 가능성이 있습니다."
    checks:
      - "직전 3초의 control error와 명령 내용을 확인하십시오."
    remedies:
      - "원인이 된 명령이나 자세를 수정한 뒤 Control Manager를 복구하십시오."
    evidence_gaps:
      - "상태 전환 자체는 최초 원인을 설명하지 않습니다."
    group_window: 1.0
    specificity: 90

  # 관절 상태 갱신 시간 초과
  - id: joint_state_update_timeout
    major_category: communication
    sub_category: state_update_timeout
    family: joint_state_timeout
    title: "관절 상태 갱신 시간 초과"
    pattern: "timeout:\\s*joint\\s*['\"]?([^'\" ]+).*state update exceeded timeout"
    meaning: "해당 관절의 상태 업데이트가 설정된 200 ms 기준 안에 들어오지 않았습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "상태 미수신은 확인되지만, 단선·보드·부하 중 어느 원인인지는 추가 확인이 필요합니다."
    causes:
      - "CAN 통신이 불안정하거나 해당 모터/보드가 응답하지 않았을 가능성이 있습니다."
      - "RPC의 실시간 처리 지연으로 상태 갱신이 늦어졌을 가능성이 있습니다."
    checks:
      - "CAN선 상태를 확인하십시오. Power ON 상태에서 모터를 움직였을 때 엔코더 값이 변하는지 확인하십시오."
      - "같은 시각 다른 관절 timeout과 realtime loop 지연 로그가 함께 발생했는지 확인하십시오."
    remedies:
      - "통신 구간과 커넥터를 분리 점검한 뒤 Servo On을 다시 시도하십시오."
    evidence_gaps:
      - "모터 전원, CAN 프레임 수신 및 호스트 부하 정보가 있으면 원인 범위를 좁힐 수 있습니다."
    group_window: 1.0
    specificity: 100

  # Arm 6축 서보온 실패
  - id: isolated_arm6_servo_on_failure
    major_category: motor_joint
    sub_category: arm6_wakeup
    family: arm6_wakeup_failure
    title: "Arm 6축 Servo On 실패"
    pattern: "(?:(?:right|left)_arm_6.*(?:servo.?on|initializ).*fail|(?:no data received:\\s*\\[\\s*['\\\"](?:right|left)_arm_6['\\\"]\\s*\\]))"
    meaning: "Arm 6축에서만 초기화 데이터가 수신되지 않았습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "Arm 6축 단독 미수신 패턴과 일치하지만 하드웨어 확인 전 원인은 추정입니다."
    causes:
      - "보드가 정상적으로 깨어나지 않았을 가능성이 있습니다."
      - "코인셀이 방전되었을 가능성이 있습니다."
      - "WY2 커넥터의 접촉 상태가 불량할 가능성이 있습니다."
      - "납땜부 쇼트가 있을 가능성이 있습니다."
    checks:
      - "Preset 명령을 실행해 보십시오."
      - "코인셀 전압을 확인하십시오."
      - "WY2 커넥터의 접촉 상태를 확인하십시오."
      - "납땜부에 쇼트가 있는지 확인하십시오."
    remedies:
      - "문제가 반복되면 커넥터, 코인셀 또는 관련 보드의 교체 점검을 진행하십시오."
    evidence_gaps:
      - "Preset 전후 결과와 코인셀 실측 전압이 필요합니다."
    group_window: 30.0
    specificity: 110

  # 모터 초기화 데이터 미수신
  - id: motor_communication_no_data
    major_category: motor_joint
    sub_category: motor_communication
    family: motor_communication_loss
    title: "모터 초기화 데이터 미수신"
    pattern: "(?:no data (?:received|coming|comming)|(?:initialize|initializing) motor.*(?:failed|timeout|error))"
    meaning: "Servo On 과정에서 표시된 모터들의 응답 데이터가 수신되지 않았습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "미수신 대상은 확인되지만 CAN 배선, 전원, 보드 중 원인 구분이 필요합니다."
    causes:
      - "CAN 통신이 불안정할 가능성이 있습니다."
    checks:
      - "CAN선 상태를 확인하십시오. Power ON 상태에서 모터를 움직였을 때 엔코더 값이 변하는지 확인하십시오."
      - "미수신 축이 한 축, 한 팔 전체 또는 전 로봇인지 범위를 확인하십시오."
    remedies:
      - "문제 구간의 커넥터와 하네스를 분리 점검한 뒤 Servo On을 다시 시도하십시오."
    evidence_gaps:
      - "CAN 프레임 수신 여부와 모터 전원 실측값이 필요합니다."
    group_window: 30.0
    specificity: 100

  # 모터 드라이브 비트 에러 (BIG, JAM, CUR, INPUT, TEMP)
  - id: motor_big_error
    major_category: motor_joint
    sub_category: drive_bit_error
    family: motor_drive_error
    title: "모터 BIG 오류"
    pattern: "\\bbig\\s+error\\b"
    meaning: "모터 드라이브에서 BIG 오류 비트가 보고되었습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "BIG 오류 비트는 확인되지만 물리 원인은 상태값과 기구 점검이 필요합니다."
    causes:
      - "모터 내부에서 복합 또는 중대한 오류 상태가 발생했을 가능성이 있습니다."
    checks:
      - "표시된 축의 기구 간섭, 발열, 소음 및 수동 움직임을 확인하십시오."
      - "Fault CSV에서 해당 축의 전류, 위치, 목표 위치 변화를 확인하십시오."
    remedies:
      - "부하와 간섭을 제거한 뒤 오류를 초기화하고 저속으로 재현 여부를 확인하십시오."
    evidence_gaps:
      - "해당 축의 전류·온도·목표값과 발생 직전 명령이 필요합니다."
    group_window: 1.0
    specificity: 105

  - id: motor_jam_error
    major_category: motor_joint
    sub_category: drive_bit_error
    family: motor_drive_error
    title: "모터 JAM 오류"
    pattern: "\\bjam\\s+error\\b"
    meaning: "모터가 목표를 따라가지 못하고 걸림 상태로 판단되었습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "JAM 오류 비트는 확인되지만 물리 원인은 상태값과 기구 점검이 필요합니다."
    causes:
      - "기구 간섭, 과부하, 브레이크 또는 구동부 걸림이 발생했을 가능성이 있습니다."
    checks:
      - "표시된 축의 기구 간섭, 발열, 소음 및 수동 움직임을 확인하십시오."
      - "Fault CSV에서 해당 축의 전류, 위치, 목표 위치 변화를 확인하십시오."
    remedies:
      - "부하와 간섭을 제거한 뒤 오류를 초기화하고 저속으로 재현 여부를 확인하십시오."
    evidence_gaps:
      - "해당 축의 전류·온도·목표값과 발생 직전 명령이 필요합니다."
    group_window: 1.0
    specificity: 105

  - id: motor_cur_error
    major_category: motor_joint
    sub_category: drive_bit_error
    family: motor_drive_error
    title: "모터 CUR 오류"
    pattern: "\\bcur\\s+error\\b"
    meaning: "모터 전류 관련 보호 오류가 보고되었습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "CUR 오류 비트는 확인되지만 물리 원인은 상태값과 기구 점검이 필요합니다."
    causes:
      - "과부하, 급격한 명령 또는 전류 센싱 이상이 발생했을 가능성이 있습니다."
    checks:
      - "표시된 축의 기구 간섭, 발열, 소음 및 수동 움직임을 확인하십시오."
      - "Fault CSV에서 해당 축의 전류, 위치, 목표 위치 변화를 확인하십시오."
    remedies:
      - "부하와 간섭을 제거한 뒤 오류를 초기화하고 저속으로 재현 여부를 확인하십시오."
    evidence_gaps:
      - "해당 축의 전류·온도·목표값과 발생 직전 명령이 필요합니다."
    group_window: 1.0
    specificity: 105

  - id: motor_input_error
    major_category: motor_joint
    sub_category: drive_bit_error
    family: motor_drive_error
    title: "모터 INPUT 오류"
    pattern: "\\binput\\s+error\\b"
    meaning: "모터 입력 또는 참조값 관련 오류가 보고되었습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "INPUT 오류 비트는 확인되지만 물리 원인은 상태값과 기구 점검이 필요합니다."
    causes:
      - "허용되지 않은 참조값 또는 입력 신호 이상이 발생했을 가능성이 있습니다."
    checks:
      - "표시된 축의 기구 간섭, 발열, 소음 및 수동 움직임을 확인하십시오."
      - "Fault CSV에서 해당 축의 전류, 위치, 목표 위치 변화를 확인하십시오."
    remedies:
      - "부하와 간섭을 제거한 뒤 오류를 초기화하고 저속으로 재현 여부를 확인하십시오."
    evidence_gaps:
      - "해당 축의 전류·온도·목표값과 발생 직전 명령이 필요합니다."
    group_window: 1.0
    specificity: 105

  - id: motor_temp_error
    major_category: motor_joint
    sub_category: drive_bit_error
    family: motor_drive_error
    title: "모터 TEMP 오류"
    pattern: "\\btemp(?:erature)?\\s+error\\b"
    meaning: "모터 온도 보호 오류가 보고되었습니다."
    severity: error
    role: root
    confidence: medium
    confidence_reason: "TEMP 오류 비트는 확인되지만 물리 원인은 상태값과 기구 점검이 필요합니다."
    causes:
      - "연속 고부하 또는 냉각 불량으로 모터 온도가 상승했을 가능성이 있습니다."
    checks:
      - "표시된 축의 발열 상태 및 쿨링 팬 동작을 확인하십시오."
      - "Fault CSV에서 해당 축의 온도 변화를 확인하십시오."
    remedies:
      - "모터를 충분히 냉각시키고 부하 조건을 완화하십시오."
