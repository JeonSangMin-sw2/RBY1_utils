      - "손목 모터 회전 축 고착 및 타이밍 벨트(MXL82), 풀리(MXL20, MXL40) 마모를 점검하십시오."
    remedies:
      - "BNO 15번 확인 시: BNO 재설정 및 모터 제어 보드 교체를 진행하십시오."
