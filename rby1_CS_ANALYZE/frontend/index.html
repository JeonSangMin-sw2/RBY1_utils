<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RB-Y1 CS 로그 분석기</title>
  <style>
    body { margin: 0; background: #0b0e11; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .initialLoader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(0, 173, 181, 0.2); border-top-color: #00adb5; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="initialLoader">
      <div class="spinner"></div>
      <div style="font-size: 14px; color: #94a3b8;">RB-Y1 CS 분석기를 불러오는 중입니다...</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
